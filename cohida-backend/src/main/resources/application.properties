spring.application.name=cohida
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=cohida-api
security.jwt.access-token-ttl=30d
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
cohida.upload.directory=${COHIDA_UPLOAD_DIRECTORY:uploads/products}
cohida.queue.enabled=${COHIDA_QUEUE_ENABLED:false}
spring.task.scheduling.pool.size=3
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

cohida.openrouter.api-key=${OPENROUTER_API_KEY:unconfigured}
cohida.openrouter.model=${OPENROUTER_MODEL:openrouter/free}
spring.ai.openai.api-key=${cohida.openrouter.api-key}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=${cohida.openrouter.model}
spring.ai.openai.chat.max-tokens=600
spring.ai.openai.timeout=60s
spring.ai.openai.max-retries=0
spring.ai.model.embedding=none
